<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
          integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z"
          crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
        integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <title>Hayden Auditorium</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'icon.png' %}" >

    <style>
        customPass {
            text-security: disc;
            -webkit-text-security: disc;
            -mox-text-security: disc;
        }

        #body:fullscreen {
            background-color: grey;
        }
        #body:-webkit-full-screen {
            background-color: grey;
        }
        #body:-moz-full-screen {
            background-color: grey;
        }

        .bottom {
            position: fixed;
            bottom: 0px;
            right: 50vw;
            left:50vw;
            width: 20vw;
            height:15vh;
            padding: 5px;
        }

        .currentBox {
            height: 20vh; 
            width: 100%; 
            border: 6px solid #800000; 
            border-radius: 1rem; 
            padding: 5px; 
            display: flex!important;
            flex-direction: column!important;
            justify-content: center!important;
        }

        .nextBox {
            height: 12vh; 
            width: 100%; 
            border: 6px solid #000099; 
            border-radius: 1rem; 
            padding: 5px; 
            display: flex!important;
            flex-direction: column!important;
            justify-content: center!important;
        }

        .afterBox {
            height: 12vh; 
            width: 100%; 
            border: 6px solid #003300; 
            border-radius: 1rem; 
            padding: 5px; 
            display: flex!important;
            flex-direction: column!important;
            justify-content: center!important;
        }

        .titleBox {
            position: fixed;
            top: 0px;
            right: 0px;
            left: 0px;
            height: 15vh; 
            display: flex!important;
            flex-direction: column!important;
            align-items: center;
            justify-content: center!important;
        }

        .estBox {
            position: fixed;
            bottom: 0px;
            right: 0px;
            left: 0px;
            height: 15vh; 
            display: flex!important;
            flex-direction: row!important;
            align-items: center;
            justify-content: center!important;
        }

        .centerThing {
            display: flex!important;
            flex-direction: column!important;
            justify-content: center!important;
        }
    </style>
</head>
<body style="background-color:grey;" id="body">
    <div class="container-lg">
        <div class="d-flex align-items-center justify-content-center flex-column" style="height: 100vh" id="container">
                <h1 style="color:white; font-family:impact; font-size:10vh;">Upload Show CSV</h1>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="file" name="csv_file" accept=".csv">
                    </div>
                    <button type="submit" class="btn btn-primary">Upload CSV</button>
                </form>
        </div>
    </div>
    <div style="position: fixed; bottom: 10px; right: 10px;">
        Created by Max Miller<br>
        &copy;2026 - All Rights Reserved<br>
    </div>
</body>

</html>
