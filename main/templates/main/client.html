<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
          integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z"
          crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
        integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <title>Hayden Auditorium</title>

    <style>
        customPass {
            text-security:disc;
            -webkit-text-security:disc;
            -mox-text-security:disc;
        }
    </style>
</head>
<body style="background-color:grey;">
    <div class="float-right" id="main">
        <div class="d-flex align-items-center justify-content-center" style="height: 100vh">
            <div class="d-flex align-items-center justify-content-center flex-column" style="height: 60vh">
                <div class="p-2">
                    <div class="border-0 rounded" style="height: 20vh; width: 40vh">
                        <h1 style="color:#800000; font-family:impact;">Current: </h1>
                        <h2 id="current-text" style="text-indent: 50px;"></h2>
                    </div>
                </div>
                <div class="p-2">
                    <div class="border-0 rounded" style="height: 20vh; width: 40vh">
                        <h1 style="color:#000099; font-family:impact;">Next: </h1>
                        <h2 id="next-text" style="text-indent: 50px;"></h2>
                    </div>
                </div>
                <div class="p-2">
                    <div class="border-0 rounded" style="height: 20vh; width: 40vh">
                        <h1 style="color:#003300; font-family:impact;">After: </h1>
                        <h2 id="after-text" style="text-indent: 50px;"></h2>
                    </div>
                </div>
                <div class="p-2">
                    <div class="border-0 rounded" style="height: 20vh; width: 40vh">
                        <h1 style="color:#6600cc; font-family:impact;">Estimated Time: </h1>
                        <h2 id="est-text" style="text-indent: 50px;"></h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container" id="mainContainer">
        <div class="d-flex align-items-center justify-content-center flex-column" style="height: 100vh">
            <div class="p-2">
                <h1 style="color:white; font-family:impact; font-size:600%;">{{displayName}}</h1>
            </div>
        </div>
    </div>
    <div class="container" id="offlineContainer">
        <div class="d-flex align-items-center justify-content-center flex-column" style="height: 100vh">
            <div class="p-2">
                <h1 style="color:#990000; font-family:impact; font-size:2000%;">Offline</h1>
            </div>
            <div class="p-2">
                <h1 style="color:white; font-family:impact; font-size:200%;">We're working on it!</h1>
            </div>
        </div>
    </div>
    <div class="modal fade" id="Authorise" tabindex="-1" role="dialog" aria-labelledby="EditDisplayLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="EditDisplayLabel">Authorise</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="search" class="form-control customPass" placeholder="" aria-label="Name: " aria-describedby="basic-addon1" id="RFID" autocomplete="off" disabled>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" id="AuthoriseClose">Close</button>
                    <button type="button" class="btn btn-success" id="AuthoriseSubmit">Authorise</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="AdminControl" tabindex="-1" role="dialog" aria-labelledby="AdminControlLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="AdminControlLabel">Authorise</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <button type="button" class="btn btn-success" id="AdminControl-SwitchDisplay">Switch Display</button>
                    <button type="button" class="btn btn-success" id="AdminControl-Reload">Reload</button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="{% static 'reconnecting-websocket.js' %}"></script>
<script>var DisplayNumb = "{{displayID}}";</script>
<script src="{% static 'client.js' %}"></script>

</html>
